<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Kefaru Tech</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{
      --blue:#2563eb; --ink:#0f172a; --muted:#64748b; --line:#dbe3ef; --field:#f6f8fc;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(96,165,250,.35), transparent 45%),
        radial-gradient(circle at 90% 95%, rgba(139,92,246,.30), transparent 50%),
        linear-gradient(160deg,#0b1b4d 0%,#12308a 55%,#1d4ed8 100%);
    }

    .card{
      position:relative;
      width:100%;
      max-width:560px;
      padding:44px 36px 36px;
      text-align:center;
      background:#fff;
      border-radius:24px;
      box-shadow:0 30px 70px rgba(5,15,50,.35);
      animation:pop .6s ease;
      overflow:hidden;
    }
    /* top accent bar */
    .card::before{
      content:"";position:absolute;top:0;left:0;right:0;height:6px;
      background:linear-gradient(90deg,#2563eb,#7dd3fc,#a78bfa);
    }

    @keyframes pop{
      from{transform:translateY(20px);opacity:0}
      to{transform:translateY(0);opacity:1}
    }

    .brand{
      display:inline-block;
      padding:8px 16px;
      margin-bottom:26px;
      font-weight:800;
      font-size:15px;
      letter-spacing:.02em;
      color:#fff;
      background:#111c2e;
      border-radius:10px;
    }
    /* If you have a hosted logo URL, replace the .brand div with:
       <img class="logo" src="YOUR_LOGO_URL" alt="Kefaru Tech"> */
    .logo{display:block;height:36px;margin:0 auto 26px}

    .check{
      width:84px;height:84px;margin:0 auto 22px;
      display:flex;align-items:center;justify-content:center;
      border-radius:50%;
      font-size:40px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      box-shadow:0 0 0 10px rgba(34,197,94,.12),0 10px 25px rgba(34,197,94,.35);
    }

    .eyebrow{
      font-size:11px;font-weight:700;letter-spacing:.14em;
      text-transform:uppercase;color:var(--blue);
    }

    h1{
      margin:8px 0 12px;
      font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--ink);
    }

    .lead{
      margin:0 auto 26px;
      max-width:420px;
      font-size:15px;line-height:1.7;color:var(--muted);
    }

    .steps{
      list-style:none;
      display:grid;gap:10px;
      margin-bottom:28px;
      text-align:left;
    }
    .steps li{
      display:flex;align-items:center;gap:14px;
      padding:12px 14px;
      font-size:13.5px;color:#1e293b;
      background:var(--field);
      border:1px solid var(--line);
      border-radius:12px;
    }
    .num{
      flex:0 0 26px;height:26px;
      display:grid;place-items:center;
      font-size:12px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      border-radius:50%;
    }

    .btn{
      display:inline-block;
      padding:14px 30px;
      font-size:15px;font-weight:700;text-decoration:none;color:#fff;
      background:linear-gradient(90deg,#2563eb,#3b82f6);
      border-radius:12px;
      box-shadow:0 10px 22px rgba(37,99,235,.3);
      transition:transform .15s,box-shadow .15s;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(37,99,235,.38)}
    .btn:focus-visible{outline:3px solid rgba(37,99,235,.4);outline-offset:2px}

    .footer{margin-top:24px;font-size:12.5px;color:#94a3b8}

    @media (max-width:480px){
      .card{padding:38px 22px 30px}
      h1{font-size:26px}
      .lead{font-size:14px}
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="brand">Kefaru Tech</div>

    <div class="check" aria-hidden="true">&#10003;</div>

    <div class="eyebrow">Enquiry received</div>
    <h1>Thank you!</h1>

    <p class="lead">
      Your information has been submitted successfully. Our team has received your
      property enquiry and will contact you as soon as possible.
    </p>
    <!-- Replace # with your enquiry form URL -->
    <a class="btn" href="https://kefarutechnologypvtltd--demo.sandbox.my.site.com/real/">Submit another enquiry</a>
    <div class="footer">&copy; Kefaru Tech. All rights reserved.</div>

  </main>
</body>
</html>
